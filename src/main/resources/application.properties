# ===================================================================
# Travel Package Booking System - Application Configuration
# ===================================================================

# Server Port
# Use PORT env var when set; otherwise default to 8085 to avoid stale local conflicts
server.port=${PORT:8085}

# MySQL Database Configuration
# Replace YOUR_PASSWORD with your MySQL root password (e.g. root or your custom password)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
